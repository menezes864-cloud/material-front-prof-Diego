<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Componentes com JavaScript</title>


    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =================================================
         MENU
         ================================================= -->

    <!--
        Neste momento o elemento está vazio.

        O JavaScript será responsável por colocar
        o conteúdo do menu dentro dele.
    -->

    <div id="menu"></div>



    <!-- =================================================
         CONTEÚDO PRINCIPAL
         ================================================= -->

    <main class="conteudo">


        <span class="tag">
            PROJETO 04
        </span>


        <h1>
            Página Inicial
        </h1>


        <p>

            Este conteúdo pertence somente
            à página inicial.

        </p>


        <p>

            O menu e o rodapé são inseridos
            automaticamente pelo JavaScript.

        </p>


    </main>



    <!-- =================================================
         RODAPÉ
         ================================================= -->

    <!--
        Assim como o menu, o rodapé começa vazio.

        O JavaScript irá inserir seu conteúdo.
    -->

    <div id="rodape"></div>



    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script
        src="script.js"
    ></script>


</body>

</html>
