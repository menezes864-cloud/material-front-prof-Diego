<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- =================================================
         CONFIGURAÇÕES
         ================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Formulário | JavaScript</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =================================================
         CONTEÚDO PRINCIPAL
         ================================================= -->

    <main class="container">


        <!-- =================================================
             CABEÇALHO
             ================================================= -->

        <header class="cabecalho">

            <span class="tag">
                PROJETO 07
            </span>


            <h1>
                Inscrição no Curso
            </h1>


            <p>

                Preencha os dados abaixo para
                realizar sua inscrição.

            </p>

        </header>



        <!-- =================================================
             FORMULÁRIO
             ================================================= -->

        <form
            id="formulario" class="formulario"
        >


            <!-- =================================================
                 NOME
                 ================================================= -->

            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>


                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                >


                <!--
                    Esta mensagem será utilizada
                    pelo JavaScript caso exista
                    algum problema.
                -->

                <small
                    id="erroNome"
                    class="mensagem-erro"
                ></small>

            </div>



            <!-- =================================================
                 E-MAIL
                 ================================================= -->

            <div class="campo">

                <label for="email">
                    E-mail
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >


                <small
                    id="erroEmail"
                    class="mensagem-erro"
                ></small>

            </div>



            <!-- =================================================
                 IDADE
                 ================================================= -->

            <div class="campo">

                <label for="idade">
                    Idade
                </label>


                <input
                    type="number"
                    id="idade"
                    placeholder="Digite sua idade"
                >


                <small
                    id="erroIdade"
                    class="mensagem-erro"
                ></small>

            </div>



            <!-- =================================================
                 CURSO
                 ================================================= -->

            <div class="campo">

                <label for="curso">
                    Escolha o curso
                </label>


                <select id="curso">


                    <option value="">
                        Selecione uma opção
                    </option>


                    <option value="javascript">
                        JavaScript
                    </option>


                    <option value="python">
                        Python
                    </option>


                    <option value="banco">
                        Banco de Dados
                    </option>


                </select>


                <small
                    id="erroCurso"
                    class="mensagem-erro"
                ></small>

            </div>



            <!-- =================================================
                 BOTÃO
                 ================================================= -->

            <button
                type="submit"
                class="btn"
            >

                Realizar inscrição

            </button>



            <!-- =================================================
                 MENSAGEM FINAL
                 ================================================= -->

            <div
                id="resultado" class="resultado"
            ></div>


        </form>


    </main>



    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script
        src="script.js"
    ></script>


</body>

</html>
