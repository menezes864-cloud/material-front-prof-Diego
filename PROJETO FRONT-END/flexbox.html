<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
</head>
<body>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>
    
    <style>
        .container {
            display: flex;
            background-color: green;
            flex-wrap:wrap ;
            justify-content: center;
            gap: 30px;
        }

        .item {
            background-color: #a66;
            padding: 20px;
            text-align: center;
         }
         </style>


        
         <div class="container1">
             <div class="item1">Item1 10</div>
             <div class="item1">Item1 9</div>
             <div class="item1">Item1 8</div>
             <div class="item1">Item1 7</div>
             <div class="item1">Item1 6</div>
        </div>

    <style>
        .container1 {
            display: inline-block;
            background-color: #66a;
            align-items: center;
            gap: 20px;
            height: 300px;
         }

        .item1 {
            background-color: #a66;
            padding: 20px;
            text-align: center;
         }


    </style>
    
</body>
</html>
